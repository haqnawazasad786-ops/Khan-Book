<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetPro Exchange</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #006400; /* Dark Green background */
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            color: white;
            text-align: center;
        }
        .content {
            margin-top: 80px;
        }
        .logo {
            font-size: 40px;
            font-weight: bold;
            font-style: italic;
            background: black;
            display: inline-block;
            padding: 10px 20px;
            border-radius: 10px;
            color: white;
        }
        .brand-title {
            font-size: 32px;
            font-weight: bold;
            margin-top: 15px;
        }
        .buttons-container {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        .btn {
            background-color: #004d00;
            color: white;
            border: 2px solid #008000;
            padding: 15px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .btn:active {
            background-color: #003300;
        }
    </style>
</head>
<body>

    <div class="content">
        <div class="logo">b</div>
        <div class="brand-title">BetPro<br>Exchange</div>
    </div>

    <div class="buttons-container">
        <button class="btn" onclick="window.location.href='register.html'">Register Now!</button>
<button class="btn" onclick="window.location.href='login.html'">Login Now!</button>
    </div>

</body>
</html>
